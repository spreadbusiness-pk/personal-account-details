<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Account Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      word-break: normal;
      overflow-wrap: break-word;
    }
    label, h1, h2, h3, .card-title {
      font-weight: 700 !important;
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Top App Bar -->
  <header class="bg-slate-950 text-white px-4 py-3.5 sticky top-0 z-30 shadow-md border-b border-slate-800">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-2">
      <div class="min-w-0">
        <h1 class="text-base sm:text-lg font-extrabold tracking-tight truncate">Personal Account Details</h1>
        <p id="activeSubtitle" class="text-[11px] font-semibold text-sky-300 truncate">Overview & Separate Khatas</p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="syncFromSheet()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm">
          Sync
        </button>
        <button onclick="exportPDF()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm">
          PDF
        </button>
      </div>
    </div>
  </header>

  <!-- Khata Switcher Bar -->
  <div class="bg-white border-b border-slate-200 sticky top-[62px] z-20">
    <div class="max-w-3xl mx-auto px-3 py-2.5 flex items-center gap-2 overflow-x-auto">
      <button onclick="setView('overview')" id="nav-overview" class="nav-pill shrink-0 px-3.5 py-2 rounded-xl text-xs font-extrabold bg-slate-900 text-white">
        Dashboard
      </button>
      <button onclick="setView('Sajidha Home')" id="nav-Sajidha Home" class="nav-pill shrink-0 px-3.5 py-2 rounded-xl text-xs font-extrabold bg-slate-100 text-slate-800">
        Sajidha Home
      </button>
      <button onclick="setView('Saima Home')" id="nav-Saima Home" class="nav-pill shrink-0 px-3.5 py-2 rounded-xl text-xs font-extrabold bg-slate-100 text-slate-800">
        Saima Home
      </button>
      <button onclick="setView('Spread Business')" id="nav-Spread Business" class="nav-pill shrink-0 px-3.5 py-2 rounded-xl text-xs font-extrabold bg-slate-100 text-slate-800">
        Spread Business
      </button>
      <button onclick="setView('Udhaar')" id="nav-Udhaar" class="nav-pill shrink-0 px-3.5 py-2 rounded-xl text-xs font-extrabold bg-slate-100 text-slate-800">
        Udhaar Khata
      </button>
    </div>
  </div>

  <main class="max-w-3xl mx-auto p-4 space-y-4">

    <!-- OVERVIEW LANDING PAGE -->
    <div id="overviewSection" class="space-y-4">
      <section class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
          <div class="card-title text-xs uppercase tracking-wide text-slate-600">Total Income</div>
          <div id="totalIncome" class="text-xl font-extrabold text-emerald-600 mt-1">PKR 0</div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
          <div class="card-title text-xs uppercase tracking-wide text-slate-600">Total Expense</div>
          <div id="totalExpense" class="text-xl font-extrabold text-rose-600 mt-1">PKR 0</div>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
          <div class="card-title text-xs uppercase tracking-wide text-slate-600">Net Balance</div>
          <div id="netBalance" class="text-xl font-extrabold text-slate-950 mt-1">PKR 0</div>
        </div>
      </section>

      <!-- Separate Khata Cards -->
      <section class="space-y-2.5">
        <h2 class="text-sm font-extrabold text-slate-900 px-1">Select a Khata Page</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <button onclick="setView('Sajidha Home')" class="text-left bg-white hover:border-indigo-400 rounded-2xl p-4 shadow-sm border-2 border-slate-200 transition">
            <div class="flex items-center justify-between">
              <span class="card-title text-sm font-extrabold text-indigo-700">Sajidha Home</span>
              <span class="text-xs font-bold text-indigo-600">Open →</span>
            </div>
            <div id="sajidhaTotal" class="text-lg font-extrabold text-slate-900 mt-1.5">PKR 0</div>
            <div class="text-[11px] font-semibold text-slate-500 mt-0.5">Household Khata</div>
          </button>

          <button onclick="setView('Saima Home')" class="text-left bg-white hover:border-purple-400 rounded-2xl p-4 shadow-sm border-2 border-slate-200 transition">
            <div class="flex items-center justify-between">
              <span class="card-title text-sm font-extrabold text-purple-700">Saima Home</span>
              <span class="text-xs font-bold text-purple-600">Open →</span>
            </div>
            <div id="saimaTotal" class="text-lg font-extrabold text-slate-900 mt-1.5">PKR 0</div>
            <div class="text-[11px] font-semibold text-slate-500 mt-0.5">Household Khata</div>
          </button>

          <button onclick="setView('Spread Business')" class="text-left bg-white hover:border-emerald-400 rounded-2xl p-4 shadow-sm border-2 border-slate-200 transition">
            <div class="flex items-center justify-between">
              <span class="card-title text-sm font-extrabold text-emerald-700">Spread Business</span>
              <span class="text-xs font-bold text-emerald-600">Open →</span>
            </div>
            <div id="spreadTotal" class="text-lg font-extrabold text-slate-900 mt-1.5">PKR 0</div>
            <div class="text-[11px] font-semibold text-slate-500 mt-0.5">Office & Printing Khata</div>
          </button>
        </div>
      </section>

      <!-- Accounts Net Flow -->
      <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h2 class="text-sm font-extrabold text-slate-900 mb-3">Accounts Net Flow</h2>
        <div id="accountsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>
      </section>
    </div>

    <!-- DEDICATED KHATA HEADER -->
    <div id="khataSection" class="hidden space-y-4">
      <div class="bg-slate-900 text-white rounded-2xl p-4 shadow flex items-center justify-between gap-3">
        <div>
          <div class="text-[11px] font-bold uppercase tracking-wider text-sky-300">Active Khata</div>
          <h2 id="khataHeading" class="text-xl font-extrabold mt-0.5">Sajidha Home</h2>
          <p id="khataSummarySub" class="text-xs font-semibold text-slate-300 mt-1">Total Expense: PKR 0</p>
        </div>
        <button onclick="toggleForm()" class="bg-indigo-500 hover:bg-indigo-400 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl shrink-0">
          + New Entry
        </button>
      </div>
    </div>

    <!-- ENTRY / EDIT FORM -->
    <section id="entryFormCard" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-2.5">
        <h2 id="formTitle" class="text-sm font-extrabold text-slate-900">Add Entry</h2>
        <div class="flex items-center gap-2">
          <button type="button" onclick="addCustomCategory()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-extrabold px-3 py-1.5 rounded-lg">
            + Add Category
          </button>
          <button type="button" onclick="toggleCategoryManager()" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-extrabold px-3 py-1.5 rounded-lg">
            Manage Categories
          </button>
        </div>
      </div>

      <!-- Category Manager Drawer -->
      <div id="categoryManagerBox" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2">
        <div class="text-xs font-extrabold text-slate-800">Categories List (Click ✕ to remove wrong category)</div>
        <div id="categoryChips" class="flex flex-wrap gap-2"></div>
      </div>

      <form id="entryForm" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
        <input type="hidden" id="editId" value="" />

        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Entry Type</label>
          <select id="type" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-semibold bg-white">
            <option value="Expense" selected>Expense</option>
            <option value="Income">Income</option>
            <option value="Udhaar">Udhaar</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Khata / Profile</label>
          <select id="profile" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-semibold bg-white">
            <option value="Sajidha Home">Sajidha Home</option>
            <option value="Saima Home">Saima Home</option>
            <option value="Spread Business">Spread Business</option>
            <option value="Personal Income">Personal Income</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Category</label>
          <select id="category" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-semibold bg-white"></select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Amount (PKR)</label>
          <input id="amount" type="number" min="1" step="any" placeholder="0" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-bold" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Payment Account</label>
          <select id="account" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-semibold bg-white">
            <option value="Cash">Cash</option>
            <option value="JazzCash">JazzCash</option>
            <option value="EasyPaisa">EasyPaisa</option>
            <option value="SadaPay">SadaPay</option>
            <option value="Bank Account">Bank Account</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Location / Area</label>
          <div class="flex items-center gap-2">
            <input id="location" type="text" placeholder="e.g. Jubilee Town, LDA, Thokar" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium" />
            <button type="button" onclick="captureGPSLocation()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-extrabold px-3 py-2.5 rounded-xl shrink-0">
              GPS
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Date</label>
          <input id="date" type="date" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-semibold" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-800 mb-1">Time</label>
          <input id="time" type="time" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-semibold" />
        </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-bold text-slate-800 mb-1">Receipt Image (Optional)</label>
          <input id="receiptFile" type="file" accept="image/*" class="w-full border border-slate-300 rounded-xl px-2.5 py-2 text-xs font-semibold bg-slate-50" />
        </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-bold text-slate-800 mb-1">Description / Tafseel</label>
          <input id="note" type="text" placeholder="Write details of why and how this expense was used..." class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-sm font-medium" />
        </div>

        <div class="sm:col-span-2 flex flex-wrap items-center justify-between gap-2 pt-1">
          <span id="statusMsg" class="text-xs font-bold text-slate-600">Ready</span>
          <div class="flex items-center gap-2">
            <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-800 text-sm font-bold px-4 py-2.5 rounded-xl">
              Cancel Edit
            </button>
            <button type="submit" id="submitBtn" class="bg-slate-950 hover:bg-slate-800 text-white text-sm font-extrabold px-5 py-2.5 rounded-xl shadow-sm">
              Save Entry
            </button>
          </div>
        </div>
      </form>
    </section>

    <!-- RECORDS SECTION -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 id="recordsHeading" class="text-sm font-extrabold text-slate-900">Records</h2>
        <div class="flex flex-wrap items-center gap-2 text-xs font-bold">
          <input id="fromDate" type="date" onchange="renderAll()" class="border border-slate-300 rounded-lg px-2.5 py-1.5 font-semibold" />
          <input id="toDate" type="date" onchange="renderAll()" class="border border-slate-300 rounded-lg px-2.5 py-1.5 font-semibold" />
          <select id="filterType" onchange="renderAll()" class="border border-slate-300 rounded-lg px-2.5 py-1.5 font-bold bg-white">
            <option value="ALL">All Types</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
            <option value="Udhaar">Udhaar</option>
          </select>
        </div>
      </div>
      <div id="recordsList" class="divide-y divide-slate-100 text-sm"></div>
    </section>
  </main>

  <!-- Receipt Modal -->
  <div id="receiptModal" class="fixed inset-0 bg-black/75 hidden items-center justify-center p-4 z-50" onclick="closeReceipt()">
    <div class="bg-white rounded-2xl max-w-lg w-full p-4 space-y-3" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-extrabold text-slate-900">Receipt Preview</h3>
        <button onclick="closeReceipt()" class="text-xs font-extrabold px-3 py-1.5 rounded-lg bg-slate-200 text-slate-800">Close</button>
      </div>
      <img id="receiptPreviewImg" src="" alt="Receipt" class="w-full max-h-[70vh] object-contain rounded-xl border" />
    </div>
  </div>

  <script>
    const SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyO6a7M2j7yFYJbOauJiTKov9j_fjsZ8aj0EYHNlClAFwwLcgR2c2B2wf09J49gsw8/exec";
    const RECORDS_KEY = "personal_account_details_records_v7";
    const CATS_KEY = "personal_account_details_cats_v7";
    const ACCOUNTS = ["Cash", "JazzCash", "EasyPaisa", "SadaPay", "Bank Account"];
    const DEFAULT_CATS = ["Grocery", "Rent", "Electricity Bill", "Gas Bill", "Salary", "Printing & Paper", "Transport", "Udhaar / Loan", "General"];

    function loadSavedRecords() {
      const keys = [
        "personal_account_details_records_v7",
        "personal_account_details_records_v6",
        "personal_account_details_records_v5",
        "personal_account_details_records_v4",
        "personal_account_details_records_v3",
        "personal_account_details_records_v2",
        "personal_account_details_records_v1"
      ];
      for (const k of keys) {
        try {
          const raw = localStorage.getItem(k);
          if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length > 0) return arr;
          }
        } catch (e) {}
      }
      return [];
    }

    function loadSavedCategories() {
      const keys = [
        "personal_account_details_cats_v7",
        "personal_account_details_cats_v6",
        "personal_account_details_cats_v5",
        "personal_account_details_cats_v4",
        "personal_account_details_cats_v3",
        "personal_account_details_cats_v2"
      ];
      for (const k of keys) {
        try {
          const raw = localStorage.getItem(k);
          if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr) && arr.length > 0) return arr;
          }
        } catch (e) {}
      }
      return [...DEFAULT_CATS];
    }

    let records = loadSavedRecords();
    let categories = loadSavedCategories();
    let currentView = "overview";
    let formVisible = true;

    function setNowDateTime() {
      const now = new Date();
      document.getElementById("date").value = now.toISOString().slice(0, 10);
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("time").value = `${hh}:${mm}`;
    }

    setNowDateTime();
    saveState();

    function cleanDateValue(rawDate) {
      if (!rawDate) return "";
      const str = String(rawDate).trim();
      const match = str.match(/^(\d{4}-\d{2}-\d{2})/);
      return match ? match[1] : str;
    }

    function inferAreaFromText(text) {
      const str = String(text || "");
      const knownAreas = [
        "Jubilee Town", "LDA", "Thokar", "Raiwind Road", "Johar Town", "Model Town",
        "Garden Town", "Iqbal Town", "Sabzazar", "Gulberg", "DHA", "Bahria Town",
        "Faisal Town", "Wapda Town", "Multan Road", "Samanabad", "Shahdara", "Ali Town",
        "Sher Shah Colony", "Kachi Kothi"
      ];
      const lower = str.toLowerCase();
      for (const area of knownAreas) {
        if (lower.includes(area.toLowerCase())) return area;
      }
      const onMatch = str.match(/\bon\s+([A-Za-z0-9\s]{3,28}?)(?:\s+(?:for|to|at|by|in|per|ka|ki|ke)\b|[.,]|$)/i);
      if (onMatch && onMatch[1]) {
        const cand = onMatch[1].trim();
        if (!/^(duty|cash|room|dinner|lunch|rent|bill|grocery|milk|eggs|fries|banana)$/i.test(cand)) {
          return cand;
        }
      }
      return "";
    }

    function getRecordLocation(rec) {
      if (rec.location && String(rec.location).trim()) return String(rec.location).trim();
      return inferAreaFromText(rec.note || "");
    }

    function formatPKR(n) {
      return "PKR " + Number(n || 0).toLocaleString();
    }

    function setStatus(msg) {
      document.getElementById("statusMsg").textContent = msg;
    }

    function saveState() {
      localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
      localStorage.setItem(CATS_KEY, JSON.stringify(categories));
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function renderCategories() {
      const sel = document.getElementById("category");
      const current = sel.value;
      sel.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
      if (current && categories.includes(current)) {
        sel.value = current;
      }

      const chips = document.getElementById("categoryChips");
      chips.innerHTML = categories.map(cat => `
        <span class="inline-flex items-center gap-1.5 bg-white border border-slate-300 rounded-lg px-2.5 py-1 text-xs font-bold text-slate-800">
          ${escapeHtml(cat)}
          <button type="button" onclick="deleteCategory('${escapeHtml(cat).replace(/'/g, "\\'")}')" class="text-rose-600 font-extrabold hover:text-rose-800" title="Delete Category">✕</button>
        </span>
      `).join("");
    }

    function toggleCategoryManager() {
      document.getElementById("categoryManagerBox").classList.toggle("hidden");
    }

    function addCustomCategory() {
      const name = prompt("Enter new category name:");
      if (!name) return;
      const clean = name.trim();
      if (!clean) return;
      if (!categories.includes(clean)) {
        categories.push(clean);
        saveState();
        renderCategories();
        document.getElementById("category").value = clean;
        pushCategoryToSheet(clean);
      }
    }

    function deleteCategory(catName) {
      if (categories.length <= 1) {
        alert("At least one category must remain.");
        return;
      }
      if (!confirm(`Remove category "${catName}"?`)) return;
      categories = categories.filter(c => c !== catName);
      saveState();
      renderCategories();
    }

    function captureGPSLocation() {
      if (!navigator.geolocation) {
        alert("GPS is not supported on this device.");
        return;
      }
      setStatus("Fetching GPS location...");
      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude.toFixed(6);
          const lng = pos.coords.longitude.toFixed(6);
          document.getElementById("location").value = `${lat}, ${lng}`;
          setStatus("GPS location added");
        },
        () => {
          setStatus("Could not fetch GPS — enter area/location manually");
        }
      );
    }

    function buildMapUrl(locText) {
      const clean = String(locText || "").trim();
      if (!clean) return "";
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(clean)}`;
    }

    function toggleForm() {
      formVisible = !formVisible;
      document.getElementById("entryFormCard").classList.toggle("hidden", !formVisible);
    }

    function resetForm() {
      document.getElementById("editId").value = "";
      document.getElementById("amount").value = "";
      document.getElementById("location").value = "";
      document.getElementById("note").value = "";
      document.getElementById("receiptFile").value = "";
      document.getElementById("submitBtn").textContent = "Save Entry";
      document.getElementById("cancelEditBtn").classList.add("hidden");
      document.getElementById("formTitle").textContent = currentView === "overview" ? "Add Entry" : `Add Entry in ${currentView}`;
      setNowDateTime();
    }

    function startEditRecord(id) {
      const rec = records.find(r => r.id === id);
      if (!rec) return;

      formVisible = true;
      document.getElementById("entryFormCard").classList.remove("hidden");
      document.getElementById("editId").value = rec.id;
      document.getElementById("type").value = rec.type || "Expense";
      document.getElementById("profile").value = rec.profile || "Sajidha Home";

      if (rec.category && !categories.includes(rec.category)) {
        categories.push(rec.category);
        saveState();
        renderCategories();
      }
      document.getElementById("category").value = rec.category || categories[0];
      document.getElementById("amount").value = rec.amount || "";
      document.getElementById("account").value = rec.account || "Cash";
      document.getElementById("date").value = cleanDateValue(rec.date);
      document.getElementById("time").value = rec.time || "12:00";
      document.getElementById("location").value = getRecordLocation(rec);
      document.getElementById("note").value = rec.note || "";

      document.getElementById("formTitle").textContent = "Edit Entry";
      document.getElementById("submitBtn").textContent = "Update Entry";
      document.getElementById("cancelEditBtn").classList.remove("hidden");
      document.getElementById("entryFormCard").scrollIntoView({ behavior: "smooth" });
    }

    function setView(viewName) {
      currentView = viewName;

      document.querySelectorAll(".nav-pill").forEach(btn => {
        const active = btn.id === `nav-${viewName}`;
        btn.className = active
          ? "nav-pill shrink-0 px-3.5 py-2 rounded-xl text-xs font-extrabold bg-slate-900 text-white shadow-sm"
          : "nav-pill shrink-0 px-3.5 py-2 rounded-xl text-xs font-extrabold bg-slate-100 text-slate-800";
      });

      const isOverview = viewName === "overview";
      document.getElementById("overviewSection").classList.toggle("hidden", !isOverview);
      document.getElementById("khataSection").classList.toggle("hidden", isOverview);

      if (isOverview) {
        document.getElementById("activeSubtitle").textContent = "Overview & Separate Khatas";
        document.getElementById("formTitle").textContent = "Add Entry";
        document.getElementById("recordsHeading").textContent = "All Recent Records";
      } else {
        document.getElementById("activeSubtitle").textContent = `${viewName} Dedicated Khata`;
        document.getElementById("khataHeading").textContent = viewName === "Udhaar" ? "Udhaar Khata" : `${viewName} Khata`;
        document.getElementById("formTitle").textContent = `Add Entry in ${viewName}`;
        document.getElementById("recordsHeading").textContent = `${viewName} Records`;

        if (viewName === "Udhaar") {
          document.getElementById("type").value = "Udhaar";
        } else {
          document.getElementById("profile").value = viewName;
          if (document.getElementById("type").value === "Udhaar") {
            document.getElementById("type").value = "Expense";
          }
        }
      }

      formVisible = true;
      document.getElementById("entryFormCard").classList.remove("hidden");
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve("");
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function pushCategoryToSheet(catName) {
      try {
        await fetch(SHEET_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sheet: "Categories", row: [String(Date.now()), catName] })
        });
      } catch (e) {}
    }

    async function pushToSheet(item, actionType = "save") {
      const sheetName = item.type === "Udhaar" ? "Udhaar" : "Transactions";
      const extraMeta = [
        item.time ? `Time: ${item.time}` : "",
        item.location ? `Loc: ${item.location}` : "",
        item.receiptData ? "Receipt Attached" : ""
      ].filter(Boolean).join(" | ");

      const row = [
        item.id,
        item.date,
        item.type,
        item.profile,
        item.category,
        item.amount,
        item.account,
        "",
        [item.note, extraMeta].filter(Boolean).join(" — ")
      ];

      try {
        await fetch(SHEET_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sheet: sheetName, action: actionType, id: item.id, row })
        });
        setStatus(actionType === "update" ? "Updated & synced to Google Sheet" : "Saved & synced to Google Sheet");
      } catch (err) {
        setStatus("Saved locally (Sheet sync pending)");
      }
    }

    function parseNoteAndMeta(rawNote, existing) {
      let noteStr = String(rawNote || "").trim();
      let timeVal = existing.time || "";
      let locVal = existing.location || "";

      const timeMatch = noteStr.match(/Time:\s*([^|—]+)/i);
      if (timeMatch && !timeVal) {
        timeVal = timeMatch[1].trim();
      }
      const locMatch = noteStr.match(/Loc:\s*([^|—]+)/i);
      if (locMatch && !locVal) {
        locVal = locMatch[1].trim();
      }

      const cleanNote = noteStr
        .replace(/\s*[—|]?\s*Time:\s*[^|—]+/gi, "")
        .replace(/\s*[—|]?\s*Loc:\s*[^|—]+/gi, "")
        .replace(/\s*[—|]?\s*Receipt Attached/gi, "")
        .replace(/\s*[—|]?\s*\[Receipt Attached\]/gi, "")
        .trim();

      if (!locVal) {
        locVal = inferAreaFromText(cleanNote);
      }

      return { note: cleanNote, time: timeVal, location: locVal };
    }

    async function syncFromSheet() {
      setStatus("Syncing from Google Sheet...");
      try {
        const res = await fetch(`${SHEET_WEB_APP_URL}?sheet=Transactions`);
        const data = await res.json();
        if (data && Array.isArray(data.rows) && data.rows.length > 0) {
          const localMap = {};
          records.forEach(r => { localMap[r.id] = r; });

          const parsed = data.rows
            .filter(r => Array.isArray(r) && r.length >= 6 && !isNaN(Number(r[5])))
            .map(r => {
              const id = String(r[0] || Date.now() + Math.random());
              const existing = localMap[id] || {};
              const meta = parseNoteAndMeta(r[8] || "", existing);
              return {
                id,
                date: cleanDateValue(r[1] || ""),
                time: meta.time,
                type: String(r[2] || "Expense"),
                profile: String(r[3] || "Spread Business"),
                category: String(r[4] || "General"),
                amount: Number(r[5] || 0),
                account: String(r[6] || "Cash"),
                location: meta.location,
                note: meta.note,
                receiptData: existing.receiptData || ""
              };
            });

          if (parsed.length > 0) {
            records = parsed;
            saveState();
            renderAll();
          }
        }
        setStatus("Synced with Google Sheet");
      } catch (e) {
        setStatus("Saved locally / Could not pull sheet");
      }
    }

    document.getElementById("entryForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const editId = document.getElementById("editId").value;
      const existingRec = editId ? records.find(r => r.id === editId) : null;

      const fileInput = document.getElementById("receiptFile");
      let receiptData = existingRec ? (existingRec.receiptData || "") : "";
      if (fileInput.files && fileInput.files[0]) {
        receiptData = await fileToDataUrl(fileInput.files[0]);
      }

      const item = {
        id: editId || String(Date.now()),
        type: document.getElementById("type").value,
        profile: document.getElementById("profile").value,
        category: document.getElementById("category").value,
        amount: Number(document.getElementById("amount").value),
        account: document.getElementById("account").value,
        date: cleanDateValue(document.getElementById("date").value),
        time: document.getElementById("time").value,
        location: document.getElementById("location").value.trim(),
        note: document.getElementById("note").value.trim(),
        receiptData
      };

      if (editId) {
        records = records.map(r => (r.id === editId ? item : r));
      } else {
        records.unshift(item);
      }

      saveState();
      renderAll();
      await pushToSheet(item, editId ? "update" : "save");
      resetForm();
    });

    function getViewRecords() {
      const from = document.getElementById("fromDate").value;
      const to = document.getElementById("toDate").value;
      const fType = document.getElementById("filterType").value;

      return records.filter(r => {
        const rDate = cleanDateValue(r.date);
        if (currentView === "Udhaar" && r.type !== "Udhaar") return false;
        if (currentView !== "overview" && currentView !== "Udhaar" && r.profile !== currentView) return false;
        if (fType !== "ALL" && r.type !== fType) return false;
        if (from && rDate < from) return false;
        if (to && rDate > to) return false;
        return true;
      });
    }

    function openReceipt(id) {
      const rec = records.find(r => r.id === id);
      if (!rec || !rec.receiptData) return;
      document.getElementById("receiptPreviewImg").src = rec.receiptData;
      const modal = document.getElementById("receiptModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeReceipt() {
      const modal = document.getElementById("receiptModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function deleteRecord(id) {
      if (!confirm("Delete this entry from app?")) return;
      records = records.filter(r => r.id !== id);
      saveState();
      renderAll();
    }

    function renderAll() {
      let income = 0, expense = 0, sajidha = 0, saima = 0, spread = 0, udhaarTotal = 0;
      const accTotals = {};
      ACCOUNTS.forEach(a => accTotals[a] = 0);

      records.forEach(r => {
        const amt = Number(r.amount || 0);
        if (r.type === "Income") {
          income += amt;
          if (accTotals[r.account] !== undefined) accTotals[r.account] += amt;
        } else if (r.type === "Expense") {
          expense += amt;
          if (accTotals[r.account] !== undefined) accTotals[r.account] -= amt;
          if (r.profile === "Sajidha Home") sajidha += amt;
          if (r.profile === "Saima Home") saima += amt;
          if (r.profile === "Spread Business") spread += amt;
        } else if (r.type === "Udhaar") {
          udhaarTotal += amt;
        }
      });

      document.getElementById("totalIncome").textContent = formatPKR(income);
      document.getElementById("totalExpense").textContent = formatPKR(expense);
      document.getElementById("netBalance").textContent = formatPKR(income - expense);
      document.getElementById("sajidhaTotal").textContent = formatPKR(sajidha);
      document.getElementById("saimaTotal").textContent = formatPKR(saima);
      document.getElementById("spreadTotal").textContent = formatPKR(spread);

      if (currentView !== "overview") {
        let subText = "";
        if (currentView === "Sajidha Home") subText = `Total Expense: ${formatPKR(sajidha)}`;
        else if (currentView === "Saima Home") subText = `Total Expense: ${formatPKR(saima)}`;
        else if (currentView === "Spread Business") subText = `Total Expense: ${formatPKR(spread)}`;
        else if (currentView === "Udhaar") subText = `Total Udhaar Recorded: ${formatPKR(udhaarTotal)}`;
        document.getElementById("khataSummarySub").textContent = subText;
      }

      document.getElementById("accountsGrid").innerHTML = ACCOUNTS.map(acc => `
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
          <div class="card-title text-xs font-bold text-slate-600">${escapeHtml(acc)}</div>
          <div class="text-sm font-extrabold text-slate-900 mt-1">${formatPKR(accTotals[acc])}</div>
        </div>
      `).join("");

      const list = getViewRecords();
      const container = document.getElementById("recordsList");
      if (!list.length) {
        container.innerHTML = `<p class="py-8 text-center text-slate-400 text-xs font-bold">No matching records</p>`;
        return;
      }

      container.innerHTML = list.map(r => {
        const cleanDt = cleanDateValue(r.date);
        const locVal = getRecordLocation(r);
        const mapHref = buildMapUrl(locVal);
        return `
          <div class="py-3.5 flex items-start justify-between gap-3">
            <div class="space-y-1 min-w-0">
              <div class="text-sm font-extrabold text-slate-900">
                ${escapeHtml(r.category)}
                <span class="text-xs font-bold text-slate-500">• ${escapeHtml(r.profile)} • ${escapeHtml(r.account)}</span>
              </div>
              <div class="text-xs font-semibold text-slate-500">
                ${escapeHtml(cleanDt)}
                ${r.time ? " • " + escapeHtml(r.time) : ""}
                ${r.note ? " • " + escapeHtml(r.note) : ""}
              </div>
              ${locVal ? `
                <div class="text-xs font-semibold text-sky-700">
                  📍 ${escapeHtml(locVal)}
                  ${mapHref ? `<a href="${mapHref}" target="_blank" rel="noopener" class="underline font-bold ml-1">Open Map</a>` : ""}
                </div>
              ` : ""}
              <div class="flex items-center gap-3 pt-0.5">
                <button onclick="startEditRecord('${r.id}')" class="text-xs font-extrabold text-emerald-700 hover:underline">Edit</button>
                ${r.receiptData ? `<button onclick="openReceipt('${r.id}')" class="text-xs font-extrabold text-indigo-600 hover:underline">View Receipt</button>` : ""}
                <button onclick="deleteRecord('${r.id}')" class="text-xs font-bold text-rose-600 hover:underline">Delete</button>
              </div>
            </div>
            <div class="text-right text-sm font-extrabold whitespace-nowrap ${r.type === "Income" ? "text-emerald-600" : r.type === "Udhaar" ? "text-amber-600" : "text-rose-600"}">
              ${r.type === "Income" ? "+" : "-"}${formatPKR(r.amount)}
            </div>
          </div>
        `;
      }).join("");
    }

    function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const list = getViewRecords();
      const title = currentView === "overview" ? "Personal Account Details - Statement" : `${currentView} - Statement`;

      let totalSum = 0;
      list.forEach(r => {
        const amt = Number(r.amount || 0);
        if (r.type === "Income") totalSum += amt;
        else totalSum -= amt;
      });

      doc.setFontSize(14);
      doc.text(title, 14, 16);

      doc.setFontSize(10);
      doc.setTextColor(30, 41, 59);
      doc.text(`Total: ${formatPKR(Math.abs(totalSum))}   |   Entries: ${list.length}`, 14, 23);

      if (!list.length) {
        doc.text("No records found for this filter.", 14, 32);
        doc.save(`${currentView.replace(/\s+/g, "-")}-Report.pdf`);
        return;
      }

      const tableBody = [];
      const subRowIndexes = new Set();

      list.forEach(r => {
        const dt = cleanDateValue(r.date) || "-";
        const tm = r.time || "-";
        const loc = getRecordLocation(r) || "-";
        const tafseel = (r.note || "-").trim();

        tableBody.push([
          dt,
          tm,
          r.type || "-",
          r.profile || "-",
          r.category || "-",
          r.account || "-",
          loc,
          Number(r.amount || 0).toLocaleString()
        ]);

        subRowIndexes.add(tableBody.length);
        tableBody.push([
          {
            content: tafseel,
            colSpan: 8,
            styles: {
              fontSize: 7.5,
              textColor: [71, 85, 105],
              fillColor: [248, 250, 252],
              cellPadding: { top: 1.5, right: 4, bottom: 2.5, left: 6 }
            }
          }
        ]);
      });

      tableBody.push([
        {
          content: "TOTAL",
          colSpan: 7,
          styles: {
            halign: "right",
            fontStyle: "bold",
            fillColor: [226, 232, 240],
            textColor: [15, 23, 42]
          }
        },
        {
          content: Number(Math.abs(totalSum)).toLocaleString(),
          styles: {
            halign: "right",
            fontStyle: "bold",
            fillColor: [226, 232, 240],
            textColor: [15, 23, 42]
          }
        }
      ]);

      doc.autoTable({
        startY: 28,
        head: [["Date", "Time", "Type", "Profile", "Category", "Account", "Location", "Amount"]],
        body: tableBody,
        styles: { fontSize: 8.5, cellPadding: 2.5 },
        headStyles: { fillColor: [30, 86, 130] },
        didParseCell: function (data) {
          if (subRowIndexes.has(data.row.index)) {
            data.cell.styles.fillColor = [248, 250, 252];
          }
        }
      });

      doc.save(`${currentView.replace(/\s+/g, "-")}-Report.pdf`);
    }

    renderCategories();
    renderAll();
  </script>
</body>
